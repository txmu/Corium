name: Lean proofs
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean 4.19.0
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --max-time 180 \
            https://github.com/leanprover/lean4/releases/download/v4.19.0/lean-4.19.0-linux.tar.zst \
            -o "$RUNNER_TEMP/lean.tar.zst"
          tar --zstd -xf "$RUNNER_TEMP/lean.tar.zst" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/lean-4.19.0-linux/bin" >> "$GITHUB_PATH"
      - name: Recheck proofs, axiom dependencies and source mappings
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-logs
          bash formal/check_all_formal.sh 2>&1 | tee ci-logs/lean.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lean-proof-checks
          path: |
            ci-logs/lean.log
            formal/source-map.json
          if-no-files-found: error
          retention-days: 14
